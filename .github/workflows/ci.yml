# TASK-091 — Windows CI baseline.
#
# windows-latest is the required merge gate (Windows-first project with native
# modules). ubuntu-latest is fast feedback only: `allow-failure` marks it
# continue-on-error so Linux-only issues never block merging.
#
# Extensibility contract for later tasks (do NOT restructure this file):
# append steps to the "Smoke checks" block at the bottom. Owners:
#   TASK-005  better-sqlite3  -> require smoke
#   TASK-013  node-pty        -> require smoke
#   TASK-072  electron-builder-> packaged artifact smoke
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow-failure == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        include:
          - os: ubuntu-latest
            allow-failure: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Node version from package.json engines
        id: node
        shell: bash
        # Single source of truth: engines.node (e.g. ">=22 <23") -> "22".
        # Never hardcode a second copy of the version in this workflow.
        run: echo "version=$(node -p "require('./package.json').engines.node.match(/\d+/)[0]")" >> "$GITHUB_OUTPUT"

      - name: Setup Node ${{ steps.node.outputs.version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm

      - name: Install dependencies (lockfile-only)
        # npm ci runs apps/desktop's postinstall (install-electron), which
        # downloads the Electron binary on both Windows and Ubuntu runners.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      # --- Smoke checks (append below; added by TASK-005 / TASK-013 / TASK-072) ---
